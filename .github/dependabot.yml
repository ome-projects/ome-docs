version: 2
updates:
  # npm dependencies of the site
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
    groups:
      # One pull request for every minor and patch update, so that separate
      # pull requests do not race each other over pnpm-lock.yaml. Major
      # updates keep their own pull request.
      npm-minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # The site runs on Node 22, and @types/node follows the runtime's
      # major version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
